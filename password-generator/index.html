<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
  --border: #30363d; --text-primary: #c9d1d9; --text-secondary: #8b949e;
  --text-muted: #6e7681; --accent: #58a6ff; --accent-hover: #79c0ff;
  --success: #3fb950; --warning: #d2991d; --danger: #f85149; --radius: 6px; --transition: 150ms ease;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; line-height: 1.5; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 300px; min-width: 300px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.category { margin-bottom: 4px; }
.category-header { padding: 8px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); cursor: default; }
.type-item { position: relative; display: flex; align-items: center; padding: 8px 16px 8px 24px; cursor: pointer; color: var(--text-secondary); transition: background var(--transition), color var(--transition); border-left: 3px solid transparent; font-size: 13px; }
.type-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.type-item.active { background: rgba(88, 166, 255, 0.08); color: var(--accent); border-left-color: var(--accent); }
.type-item .type-icon { margin-right: 8px; font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.type-item .type-name { flex: 1; }
.fav-star { margin-left: 4px; cursor: pointer; font-size: 14px; color: var(--text-muted); transition: color var(--transition); flex-shrink: 0; padding: 2px 4px; user-select: none; }
.fav-star:hover { color: var(--warning); }
.fav-star.active { color: var(--warning); }
.fav-section { border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }
.fav-section .category-header { color: var(--warning); }
.hover-popup { display: none; position: fixed; z-index: 1000; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; max-width: 280px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: none; }
.hover-popup.visible { display: block; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
.main-header h2 { font-size: 18px; font-weight: 600; white-space: nowrap; }
.header-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tool-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 11px; cursor: pointer; transition: all var(--transition); white-space: nowrap; font-family: inherit; display: flex; align-items: center; gap: 4px; }
.tool-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(88, 166, 255, 0.08); }
.lang-select { padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-primary); font-size: 12px; font-family: inherit; cursor: pointer; outline: none; }
.lang-select:focus { border-color: var(--accent); }
.main-content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.history-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.history-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.history-actions { display: flex; gap: 6px; }
.clear-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text-muted); font-size: 11px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-tertiary); border-radius: var(--radius); cursor: pointer; transition: background var(--transition); font-size: 13px; }
.history-item:hover { background: var(--border); }
.history-item .history-type { color: var(--text-muted); font-size: 11px; margin-right: 12px; flex-shrink: 0; }
.history-item .history-value { flex: 1; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-empty { color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px; }
.settings-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.settings-section h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.setting-group { display: flex; flex-direction: column; gap: 6px; }
.setting-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.setting-group select, .setting-group input[type="number"], .setting-group input[type="text"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; transition: border-color var(--transition); }
.setting-group select:focus, .setting-group input:focus { border-color: var(--accent); }
.setting-group input[type="number"] { width: 100%; }
.toggle-group { display: flex; align-items: center; gap: 8px; }
.toggle-group input[type="checkbox"] { appearance: none; width: 36px; height: 20px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; position: relative; cursor: pointer; transition: all var(--transition); flex-shrink: 0; }
.toggle-group input[type="checkbox"]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--text-muted); border-radius: 50%; transition: all var(--transition); }
.toggle-group input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.toggle-group input[type="checkbox"]:checked::after { left: 18px; background: #fff; }
.toggle-group label { font-size: 13px; color: var(--text-primary); cursor: pointer; }
.generate-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.generate-btn { padding: 10px 24px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background var(--transition); font-family: inherit; }
.generate-btn:hover { background: var(--accent-hover); }
.generate-btn:active { transform: scale(0.98); }
.bulk-group { display: flex; align-items: center; gap: 6px; }
.bulk-group label { font-size: 12px; color: var(--text-secondary); }
.bulk-group input[type="number"] { width: 60px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; }
.bulk-group input:focus { border-color: var(--accent); }
.result-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.result-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.result-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.result-list { display: flex; flex-direction: column; gap: 8px; }
.result-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); }
.result-value { flex: 1; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 14px; word-break: break-all; color: var(--success); }
.copy-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all var(--transition); white-space: nowrap; font-family: inherit; flex-shrink: 0; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { border-color: var(--success); color: var(--success); background: rgba(63, 185, 80, 0.1); }
.qr-container { margin-top: 12px; text-align: center; }
.qr-container svg { background: #fff; border-radius: var(--radius); padding: 8px; max-width: 100%; height: auto; }
.qr-dl-btns { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.qr-dl-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 11px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
.qr-dl-btn:hover { border-color: var(--accent); color: var(--accent); }
.wordlist-upload { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.wordlist-status { font-size: 11px; color: var(--success); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
.empty-state p { font-size: 14px; margin-bottom: 4px; }
.empty-state .empty-hint { font-size: 12px; color: var(--text-muted); }
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .main-content { padding: 16px; }
  .settings-grid { grid-template-columns: 1fr; }
  .header-tools { gap: 4px; }
  .tool-btn { font-size: 10px; padding: 4px 6px; }
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">&#x1F510; <span id="sidebarTitle">Password Generator</span></div>
    <nav class="sidebar-nav" id="typeList"></nav>
  </aside>
  <main class="main">
    <div class="main-header">
      <h2 id="mainTitle">Vælg en type</h2>
      <div class="header-tools">
        <select class="lang-select" id="langSelect"><option value="da">Dansk</option><option value="en">English</option></select>
        <button class="tool-btn" id="importLangBtn" title="Importér oversat sprogfil">&#x1F4E5; <span class="ilbl">Importér sprog</span></button>
        <button class="tool-btn" id="exportTemplateBtn" title="Eksportér skabelon til oversættelse">&#x1F4E4; <span class="elbl">Eksportér skabelon</span></button>
        <input type="file" id="langFileInput" accept=".json" style="display:none;">
      </div>
    </div>
    <div class="main-content">
      <section class="history-section" id="historySection">
        <div class="history-header">
          <h3 id="historyTitle">&#x1F4CB; Seneste</h3>
          <div class="history-actions">
            <button class="clear-btn" id="clearClipboardBtn" title="Ryd udklipsholder">Ryd udklipsholder</button>
            <button class="clear-btn" id="clearHistoryBtn" title="Ryd historik">Ryd</button>
          </div>
        </div>
        <div class="history-list" id="historyList"><div class="history-empty" id="historyEmpty">Ingen historik endnu</div></div>
      </section>
      <section class="settings-section" id="settingsSection" style="display:none;">
        <h3 id="settingsTitle">&#x2699;&#xFE0F; Indstillinger</h3>
        <div class="settings-grid" id="settingsGrid"></div>
        <div style="margin-top:16px;" class="generate-section">
          <button class="generate-btn" id="generateBtn">Generér</button>
          <div class="bulk-group">
            <label id="bulkLabel" for="bulkCount">Antal:</label>
            <input type="number" id="bulkCount" min="1" max="100" value="1">
          </div>
        </div>
      </section>
      <section class="result-section" id="resultSection" style="display:none;">
        <div class="result-header">
          <h3 id="resultsTitle">&#x2728; Genererede værdier</h3>
          <div class="result-actions">
            <button class="tool-btn" id="downloadTxtBtn">&#x1F4C4; .txt</button>
            <button class="tool-btn" id="downloadCsvBtn">&#x1F4CA; .csv</button>
          </div>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="qr-container" id="qrContainer" style="display:none;"></div>
      </section>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#x1F511;</div>
        <p id="emptyText">Vælg en password-type i menuen til venstre</p>
        <p class="empty-hint" id="emptyHint">Alle passwords genereres kryptografisk sikkert med crypto.getRandomValues()</p>
      </div>
    </div>
  </main>
</div>
<div class="hover-popup" id="hoverPopup"></div>
<script src="i18n.js"></script>
<script src="wordlists.js"></script>
<script src="qr.js"></script>
<script src="types.js"></script>
<script src="app.js"></script>
</body>
</html>
