<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
  --border: #30363d; --text-primary: #c9d1d9; --text-secondary: #8b949e;
  --text-muted: #6e7681; --accent: #58a6ff; --accent-hover: #79c0ff;
  --success: #3fb950; --warning: #d2991d; --danger: #f85149; --radius: 6px; --transition: 150ms ease;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); font-size: 12px; line-height: 1.4; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 240px; min-width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 2px 0; }
.category { margin-bottom: 2px; }
.category-header { padding: 4px 12px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); cursor: default; }
.type-item { position: relative; display: flex; align-items: center; padding: 4px 12px 4px 16px; cursor: pointer; color: var(--text-secondary); transition: background var(--transition), color var(--transition); border-left: 2px solid transparent; font-size: 11px; }
.type-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.type-item.active { background: rgba(88, 166, 255, 0.08); color: var(--accent); border-left-color: var(--accent); }
.type-item .type-icon { margin-right: 4px; font-size: 11px; width: 14px; text-align: center; flex-shrink: 0; }
.type-item .type-name { flex: 1; }
.fav-star { margin-left: 1px; cursor: pointer; font-size: 10px; color: var(--text-muted); transition: color var(--transition); flex-shrink: 0; padding: 1px 2px; user-select: none; }
.fav-star:hover { color: var(--warning); }
.fav-star.active { color: var(--warning); }
.fav-section { border-bottom: 1px solid var(--border); padding-bottom: 2px; margin-bottom: 2px; }
.fav-section .category-header { color: var(--warning); }
.hover-popup { display: none; position: fixed; z-index: 1000; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; max-width: 240px; font-size: 10px; color: var(--text-secondary); line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: none; }
.hover-popup.visible { display: block; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 6px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 6px; }
.main-header h2 { font-size: 13px; font-weight: 600; white-space: nowrap; }
.header-tools { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tool-btn { padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 10px; cursor: pointer; transition: all var(--transition); white-space: nowrap; font-family: inherit; display: flex; align-items: center; gap: 3px; }
.tool-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(88, 166, 255, 0.08); }
.lang-select { padding: 3px 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-primary); font-size: 10px; font-family: inherit; cursor: pointer; outline: none; }
.lang-select:focus { border-color: var(--accent); }
.main-content { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
.history-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
.history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.history-header h3 { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.history-actions { display: flex; gap: 3px; }
.clear-btn { padding: 1px 5px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text-muted); font-size: 9px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }
.history-list { display: flex; flex-direction: column; gap: 2px; }
.history-item { display: flex; align-items: center; justify-content: space-between; padding: 4px 7px; background: var(--bg-tertiary); border-radius: var(--radius); cursor: pointer; transition: background var(--transition); font-size: 10px; }
.history-item:hover { background: var(--border); }
.history-item .history-type { color: var(--text-muted); font-size: 8px; margin-right: 5px; flex-shrink: 0; }
.history-item .history-value { flex: 1; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.history-empty { color: var(--text-muted); font-size: 9px; text-align: center; padding: 4px; }
.settings-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
.settings-section h3 { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.setting-group { display: flex; flex-direction: column; gap: 3px; }
.setting-group label { font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.setting-group select, .setting-group input[type="number"], .setting-group input[type="text"] { padding: 4px 6px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); font-size: 11px; font-family: inherit; outline: none; transition: border-color var(--transition); }
.setting-group select:focus, .setting-group input:focus { border-color: var(--accent); }
.setting-group input[type="number"] { width: 100%; }
.toggle-group { display: flex; align-items: center; gap: 4px; }
.toggle-group input[type="checkbox"] { appearance: none; width: 28px; height: 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; position: relative; cursor: pointer; transition: all var(--transition); flex-shrink: 0; }
.toggle-group input[type="checkbox"]::after { content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px; background: var(--text-muted); border-radius: 50%; transition: all var(--transition); }
.toggle-group input[type="checkbox"]:checked::after { left: 13px; background: #fff; }
.toggle-group label { font-size: 11px; color: var(--text-primary); cursor: pointer; }
.generate-section { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.generate-btn { padding: 6px 14px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background var(--transition); font-family: inherit; }
.generate-btn:hover { background: var(--accent-hover); }
.generate-btn:active { transform: scale(0.98); }
.bulk-group { display: flex; align-items: center; gap: 4px; }
.bulk-group label { font-size: 10px; color: var(--text-secondary); }
.bulk-group input[type="number"] { width: 40px; padding: 3px 4px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); font-size: 11px; font-family: inherit; outline: none; }
.bulk-group input:focus { border-color: var(--accent); }
.result-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
.result-header h3 { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
.result-actions { display: flex; gap: 3px; flex-wrap: wrap; }
.result-list { display: flex; flex-direction: column; gap: 3px; max-height: 160px; overflow-y: auto; padding-right: 3px; }
.result-item { display: flex; align-items: center; gap: 4px; padding: 5px 7px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); }
.result-value { flex: 1; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; word-break: break-all; color: var(--success); }
.copy-btn { padding: 2px 7px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 10px; cursor: pointer; transition: all var(--transition); white-space: nowrap; font-family: inherit; flex-shrink: 0; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { border-color: var(--success); color: var(--success); background: rgba(63, 185, 80, 0.1); }
.qr-container { margin-top: 4px; text-align: center; }
.qr-container svg { background: #fff; border-radius: var(--radius); padding: 2px; max-width: 130px; height: auto; }
.qr-dl-btns { display: flex; gap: 2px; justify-content: center; margin-top: 3px; flex-wrap: wrap; }
.qr-dl-btn { padding: 2px 5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 9px; cursor: pointer; transition: all var(--transition); font-family: inherit; }
.qr-dl-btn:hover { border-color: var(--accent); color: var(--accent); }
.wordlist-upload { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.wordlist-status { font-size: 9px; color: var(--success); }
.empty-state { text-align: center; padding: 12px 16px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 24px; margin-bottom: 4px; opacity: 0.3; }
.empty-state p { font-size: 11px; margin-bottom: 2px; }
.empty-state .empty-hint { font-size: 9px; color: var(--text-muted); }
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; max-height: 30vh; border-right: none; border-bottom: 1px solid var(--border); }
  .main-content { padding: 6px; gap: 4px; }
  .settings-grid { grid-template-columns: 1fr; }
  .settings-section { padding: 8px; }
  .result-section { padding: 8px; }
  .history-section { padding: 8px; }
  .header-tools { gap: 3px; }
  .tool-btn { font-size: 9px; padding: 3px 5px; }
  .main-header { padding: 6px 10px; }
  .main-header h2 { font-size: 13px; }
  .result-list { max-height: 120px; }
  .qr-container svg { max-width: 100px; }
  .generate-section { flex-direction: column; align-items: stretch; }
  .generate-btn { width: 100%; }
  .bulk-group { justify-content: center; }
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
body.large { font-size: 14px; line-height: 1.5; }
body.large .sidebar { width: 300px; min-width: 300px; }
body.large .sidebar-header { padding: 16px; font-size: 16px; }
body.large .sidebar-nav { padding: 8px 0; }
body.large .category-header { padding: 8px 16px; font-size: 11px; }
body.large .type-item { padding: 8px 16px 8px 24px; font-size: 13px; border-left-width: 3px; }
body.large .type-item .type-icon { margin-right: 8px; font-size: 14px; width: 20px; }
body.large .fav-star { margin-left: 4px; font-size: 14px; padding: 2px 4px; }
body.large .fav-section { padding-bottom: 4px; margin-bottom: 4px; }
body.large .hover-popup { padding: 10px 14px; max-width: 280px; font-size: 12px; line-height: 1.5; }
body.large .main-header { padding: 12px 24px; gap: 12px; }
body.large .main-header h2 { font-size: 18px; }
body.large .header-tools { gap: 8px; }
body.large .tool-btn { padding: 6px 10px; font-size: 11px; gap: 4px; }
body.large .lang-select { padding: 6px 8px; font-size: 12px; }
body.large .main-content { padding: 24px; gap: 20px; }
body.large .history-section { padding: 16px; }
body.large .history-header { margin-bottom: 12px; }
body.large .history-header h3 { font-size: 13px; }
body.large .history-actions { gap: 6px; }
body.large .clear-btn { padding: 4px 10px; font-size: 11px; }
body.large .history-list { gap: 6px; }
body.large .history-item { padding: 8px 12px; font-size: 13px; }
body.large .history-item .history-type { font-size: 11px; margin-right: 12px; }
body.large .history-item .history-value { font-size: inherit; }
body.large .history-empty { font-size: 12px; padding: 12px; }
body.large .settings-section { padding: 20px; }
body.large .settings-section h3 { font-size: 13px; margin-bottom: 16px; }
body.large .settings-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
body.large .setting-group { gap: 6px; }
body.large .setting-group label { font-size: 12px; }
body.large .setting-group select, body.large .setting-group input[type="number"], body.large .setting-group input[type="text"] { padding: 8px 10px; font-size: 13px; }
body.large .toggle-group { gap: 8px; }
body.large .toggle-group input[type="checkbox"] { width: 36px; height: 20px; border-radius: 10px; }
body.large .toggle-group input[type="checkbox"]::after { top: 2px; left: 2px; width: 14px; height: 14px; }
body.large .toggle-group input[type="checkbox"]:checked::after { left: 18px; }
body.large .toggle-group label { font-size: 13px; }
body.large .generate-section { gap: 12px; }
body.large .generate-btn { padding: 10px 24px; font-size: 14px; }
body.large .bulk-group { gap: 6px; }
body.large .bulk-group label { font-size: 12px; }
body.large .bulk-group input[type="number"] { width: 60px; padding: 6px 8px; font-size: 13px; }
body.large .result-section { padding: 16px; }
body.large .result-header { margin-bottom: 12px; gap: 8px; }
body.large .result-header h3 { font-size: 13px; }
body.large .result-actions { gap: 6px; }
body.large .result-list { gap: 8px; max-height: 200px; }
body.large .result-item { gap: 10px; padding: 10px 14px; }
body.large .result-value { font-size: 14px; }
body.large .copy-btn { padding: 6px 14px; font-size: 12px; }
body.large .qr-container { margin-top: 12px; }
body.large .qr-container svg { padding: 8px; max-width: 100%; }
body.large .qr-dl-btns { gap: 6px; margin-top: 8px; }
body.large .qr-dl-btn { padding: 4px 10px; font-size: 11px; }
body.large .wordlist-upload { gap: 8px; margin-top: 4px; }
body.large .wordlist-status { font-size: 11px; }
body.large .empty-state { padding: 40px 20px; }
body.large .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
body.large .empty-state p { font-size: 14px; }
body.large .empty-state .empty-hint { font-size: 12px; }
body.large ::-webkit-scrollbar { width: 8px; }
body.large ::-webkit-scrollbar-thumb { border-radius: 4px; }
@media (max-width: 768px) {
  body.large .sidebar { max-height: 40vh; }
  body.large .main-content { padding: 16px; }
  body.large .header-tools { gap: 4px; }
  body.large .tool-btn { font-size: 10px; padding: 4px 6px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">&#x1F510; <span id="sidebarTitle">Password Generator</span></div>
    <nav class="sidebar-nav" id="typeList"></nav>
  </aside>
  <main class="main">
    <div class="main-header">
      <h2 id="mainTitle">Vælg en type</h2>
      <div class="header-tools">
        <button class="tool-btn" id="zoomToggleBtn" title="Skift størrelse">&#x1F50D;</button>
        <select class="lang-select" id="langSelect"><option value="da">Dansk</option><option value="en">English</option></select>
        <button class="tool-btn" id="importLangBtn" title="Importér oversat sprogfil">&#x1F4E5; <span class="ilbl">Importér sprog</span></button>
        <button class="tool-btn" id="exportTemplateBtn" title="Eksportér skabelon til oversættelse">&#x1F4E4; <span class="elbl">Eksportér skabelon</span></button>
        <input type="file" id="langFileInput" accept=".json" style="display:none;">
      </div>
    </div>
    <div class="main-content">
      <section class="history-section" id="historySection">
        <div class="history-header">
          <h3 id="historyTitle">&#x1F4CB; Seneste</h3>
          <div class="history-actions">
            <button class="clear-btn" id="clearClipboardBtn" title="Ryd udklipsholder">Ryd udklipsholder</button>
            <button class="clear-btn" id="clearHistoryBtn" title="Ryd historik">Ryd</button>
          </div>
        </div>
        <div class="history-list" id="historyList"><div class="history-empty" id="historyEmpty">Ingen historik endnu</div></div>
      </section>
      <section class="settings-section" id="settingsSection" style="display:none;">
        <h3 id="settingsTitle">&#x2699;&#xFE0F; Indstillinger</h3>
        <div class="settings-grid" id="settingsGrid"></div>
        <div style="margin-top:8px;" class="generate-section">
          <button class="generate-btn" id="generateBtn">Generér</button>
          <div class="bulk-group">
            <label id="bulkLabel" for="bulkCount">Antal:</label>
            <input type="number" id="bulkCount" min="1" max="100" value="1">
          </div>
        </div>
      </section>
      <section class="result-section" id="resultSection" style="display:none;">
        <div class="result-header">
          <h3 id="resultsTitle">&#x2728; Genererede værdier</h3>
          <div class="result-actions">
            <button class="tool-btn" id="downloadTxtBtn">&#x1F4C4; .txt</button>
            <button class="tool-btn" id="downloadCsvBtn">&#x1F4CA; .csv</button>
          </div>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="qr-container" id="qrContainer" style="display:none;"></div>
      </section>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#x1F511;</div>
        <p id="emptyText">Vælg en password-type i menuen til venstre</p>
        <p class="empty-hint" id="emptyHint">Alle passwords genereres kryptografisk sikkert med crypto.getRandomValues()</p>
      </div>
    </div>
  </main>
</div>
<div class="hover-popup" id="hoverPopup"></div>
<script src="i18n.js"></script>
<script src="wordlists.js"></script>
<script src="qr.js"></script>
<script src="types.js"></script>
<script src="app.js"></script>
</body>
</html>
